description: >-
  Lifecycle posture for the Capterra API surface. The headline fact for this
  provider is an ownership transition, not a version bump: Capterra, GetApp and
  Software Advice were sold by Gartner to G2 (announced 2026-01-29, closed
  2026-02-05, ~$110M) and now trade as G2 Digital Markets. The developer-facing
  consequences are visible on the wire — the historically documented vendor-portal
  entry point returns 404 and the legacy Gartner console redirects to a G2 login.
