x-coverage:
  state: covered
  reason: customer-only-docs
  detail: >-
    The Click Report API itself is live and first-party — GET
    https://public-api.capterra.com/v1/clicks answers 401
    {"error":"Unauthorized"} — but its reference and Swagger console are published
    only inside the vendor portal, and the login URL every integration guide names
    (https://www.capterra.com/vp/login) now 404s after G2 acquired Capterra from
    Gartner on 2026-02-05; vendor access moved to app.g2digitalmarkets.com. Real
    public artifacts were still harvested: a verbatim llms.txt and security.txt, the
    repaired API base URL, and an error envelope observed on the wire.
  evidence:
    - url: https://public-api.capterra.com/v1/clicks
      status: 401
    - url: https://www.capterra.com/llms.txt
      status: 200
    - url: https://www.capterra.com/.well-known/security.txt
      status: 200
    - url: https://www.capterra.com/vp/login
      status: 404
    - url: https://digitalmarkets.gartner.com/insights/api
      status: 200
  checked: '2026-08-12'
