apis:
  - aid: capterra:click-report-api
    name: Capterra Click Report API
    description: >-
      The Capterra Click Report API allows software vendors to
      programmatically retrieve historical click data from their
      Capterra pay-per-click (PPC) advertising campaigns. Vendors
      can access click metrics across different software categories,
      countries, and distribution channels. The API uses API key
      authentication obtained through Capterra account managers and
      returns data across all Gartner Digital Markets / G2 Digital
      Markets accounts mapped to the vendor, covering Capterra,
      GetApp, and Software Advice.
    humanURL: https://www.capterra.com/vendors/
    tags:
      - Advertising
      - B2B
      - Click Reporting
      - PPC
      - Software Reviews
    baseURL: https://public-api.capterra.com/v1
    x-base-url-evidence: >-
      Repaired 2026-08-12. The previous baseURL (https://www.capterra.com) was the
      marketing host, which repair-api-bases.py flagged as no-usable-base. A live
      probe found the real first-party API host: GET
      https://public-api.capterra.com/v1/clicks returns HTTP 401
      {"error":"Unauthorized"} with x-request-id/x-runtime headers, while sibling
      paths return 404 — a credential-gated endpoint on Capterra's own domain.
    properties:
      - type: Portal
        url: https://www.capterra.com/vendors/
      - type: Login
        url: https://app.g2digitalmarkets.com/
      - type: Authentication
        url: authentication/capterra-authentication.yml
      - type: ErrorCatalog
        url: errors/capterra-problem-types.yml
      - type: Conventions
        url: conventions/capterra-conventions.yml
      - type: RateLimits
        url: rate-limits/capterra-rate-limits.yml
    x-features:
      - Programmatic retrieval of historical click data for PPC campaigns
      - Click metrics segmented by software category
      - Metrics segmented by country and distribution channel
      - Data unified across Capterra, GetApp, and Software Advice
      - API key authentication issued by Capterra account managers
      - Coverage of all Gartner Digital Markets accounts mapped to the vendor
    x-use-cases:
      - Vendor internal PPC reporting and dashboards
      - Attribution analysis across Gartner Digital Markets sites
      - Cross-channel marketing analytics combining Capterra data with CRM
      - Automated cost-per-lead and ROI calculations
      - Detecting anomalies and trends in category-level clicks
