name: Capterra
description: >-
  Capterra is one of the largest software review and comparison
  marketplaces, helping business buyers discover, research, and
  select software across hundreds of categories through verified
  user reviews, feature comparisons, and pricing information.
  Founded in 1999 and acquired by Gartner in 2015, Capterra was
  sold to G2 alongside its sister sites GetApp and Software Advice
  in a deal that closed on 2026-02-05, and the three properties now
  operate as G2 Digital Markets — the vendor console has moved to
  app.g2digitalmarkets.com. For participating software vendors the
  properties run a pay-per-click lead-generation program, and the
  Capterra Click Report API lets those vendors programmatically
  retrieve historical click performance data across all mapped
  accounts. The API is credential-gated and its reference is
  published only inside the authenticated vendor console.
