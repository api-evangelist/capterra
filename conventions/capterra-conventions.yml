description: >-
  Cross-cutting runtime semantics for the Capterra Click Report API, assembled from
  what a live unauthenticated caller can observe. Capterra publishes no OpenAPI and
  no public developer reference — the API documentation sits behind the vendor
  console login — so every field below is either OBSERVED on the wire or explicitly
  marked unknown. Nothing is filled in from convention.
provider: Capterra
providerId: capterra
api: Capterra Click Report API
base_url: https://public-api.capterra.com/v1
auth:
  style: api-key
  detail: authentication/capterra-authentication.yml
  observed: 401 on GET /v1/clicks without a credential
versioning:
  style: uri-path
  current: v1
  observed: true
  note: >-
    The version is carried in the path segment (/v1/). No version header, no
    date-based version, and no published version-negotiation policy were observed.
idempotency:
  supported: unknown
  header: null
  note: >-
    NOT SUPPORTED AS FAR AS CAN BE OBSERVED. This is a read-only reporting API —
    GET is the only method routed on /v1/clicks (POST returns 404) — so there is no
    write surface for an idempotency key to protect. No Idempotency-Key header is
    documented and none could be observed. No Idempotency pointer is emitted for
    this provider.
pagination:
  style: unknown
  note: >-
    Cannot be observed anonymously; the response body is only reachable with a
    vendor key. Not guessed.
filtering:
  documented_dimensions:
    - software category
    - country
    - distribution channel (Capterra / GetApp / Software Advice)
  note: >-
    These are the segmentation dimensions Capterra describes for the click report in
    public vendor-facing material. The actual query-parameter names are inside the
    gated documentation and are not recorded here.
request_id:
  supported: true
  header: x-request-id
  format: UUID v4
  observed: true
  note: Present on 401 and 404 responses alike; the only correlation handle exposed.
timing:
  header: x-runtime
  observed: true
  note: >-
    Server-side processing time in seconds. A Rails-family signature; not a
    documented contract, but present on every response.
errors:
