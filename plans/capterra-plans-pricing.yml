# 2026-08-12 REWRITE. The previous contents of this file were a bulk-sweep scaffold
# (Free / Professional / Enterprise tiers with 1,000 and 100,000 request monthly
# quotas and "TBD" prices). Capterra publishes no such plans and never has. The
# fabricated tiers are removed; the honest finding is that there is no published
# plan for this API.
description: >-
  Plans and pricing for the Capterra API surface. There is no API plan to record.
  The Capterra Click Report API is not sold as a product and carries no tier, quota,
  or price of its own — it is an entitlement of the Capterra / G2 Digital Markets
  pay-per-click advertising program, and access is granted by an account manager to
  vendors already enrolled in that program. Capterra publishes no developer pricing
  page: /vendors/pricing/ and /pricing/ both return 404, and the PPC service
  description page returns a JavaScript shell whose agent-facing markdown twin
  contains only "Loading page..." with no rate card in it.
plan_count: 0
plans: []
commercial_model:
  product: Capterra / G2 Digital Markets pay-per-click advertising
  api_is_standalone_product: false
  api_access_condition: >-
    Enrollment in the PPC program plus an API key issued by the vendor's assigned
    account manager. There is no self-service sign-up and no published API price.
  free_listing: true
  free_listing_note: >-
    Listing a product on Capterra, responding to reviews, and displaying earned
    badges are free to vendors; the paid surface is the PPC bidding program.
  published_rate_card: false
  published_rate_card_note: >-
    Third-party guides quote a per-click floor and a monthly minimum spend, but
    Capterra does not publish those figures on any page reachable without a login,
    so they are NOT recorded here as provider-published values.
evidence:
  - url: https://www.capterra.com/vendors/
    http_status: 200
    fetched: '2026-08-12'
    finding: >-
      Vendor page ("Capterra, powered by G2 Digital Markets") describes a "flexible
      lead generation program" and routes to app.g2digitalmarkets.com to get listed
      or log in. No prices, no API plans.
  - url: https://www.capterra.com/vendors/pricing/
    http_status: 404
    fetched: '2026-08-12'
  - url: https://www.capterra.com/pricing/
    http_status: 404
    fetched: '2026-08-12'
  - url: https://www.capterra.com/legal/ppc-service-description/
    http_status: 200
    fetched: '2026-08-12'
    finding: >-
      Returns 200 but the body is a client-side-rendered shell — the agent-served
      markdown twin ends at "Loading page..." — so no machine-readable commercial
      terms can be read from it.
